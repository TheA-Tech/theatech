<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | THEA.TECH</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #cbd5e1; line-height: 1.6; }
        nav { background-color: #0b0f19; border-b: 1px solid #1e293b; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        nav .logo { font-size: 24px; font-weight: 900; }
        nav .logo .blue { color: #38bdf8; }
        nav .logo .silver { color: #94a3b8; }
        nav .links a { color: #94a3b8; text-decoration: none; margin-left: 30px; font-weight: 500; }
        nav .links a:hover, nav .links a.active { color: #38bdf8; }
        .form-section { max-width: 600px; margin: 80px auto; padding: 40px; background-color: #0b0f19; border: 1px solid #1e293b; border-radius: 20px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        h2 { font-size: 30px; color: #ffffff; margin-bottom: 10px; }
        p.info { color: #64748b; font-size: 14px; margin-bottom: 30px; }
        .form-group { display: flex; gap: 20px; margin-bottom: 20px; }
        input, textarea { width: 100%; bg-color: #131926; background-color: #131926; border: 1px solid #1e293b; border-radius: 8px; padding: 12px 16px; color: #ffffff; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button { width: 100%; background: linear-gradient(to right, #38bdf8, #2563eb); color: #ffffff; border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        @media (max-width: 768px) { nav { flex-direction: column; gap: 20px; } nav .links a { margin: 0 10px; } .form-group { flex-direction: column; gap: 20px; } }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><span class="blue">THEA</span><span class="silver">.TECH</span></div>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Our Services</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>
    <section class="form-section">
        <h2>Start Your Project</h2>
        <p class="info">Fill out the brief and an integration consultant will reach out shortly.</p>
        <form>
            <div class="form-group">
                <input type="text" placeholder="Your Name">
                <input type="email" placeholder="Your Email">
            </div>
            <textarea rows="5" placeholder="Project details and scope..." style="margin-bottom: 20px;"></textarea>
            <button type="button">Transmit Details</button>
        </form>
    </section>
</body>
</html>
