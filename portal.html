<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Gateway Portal | THEA.TECH</title>
    <style>
        /* TECH-ERA MILKY WAY GATEWAY STYLE PARADIGMS */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #040814; color: #ffffff; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        
        /* MILKY WAY DYNAMIC BACKGROUND LAYER */
        #milkyWayEngine { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        /* BACK TO MAIN PORTAL LINK BUTTON */
        .back-link { position: absolute; top: 30px; left: 40px; color: rgba(255, 255, 255, 0.5); text-decoration: none; font-weight: 700; font-size: 14px; z-index: 100; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .back-link:hover { color: #00f3ff; text-shadow: 0 0 8px #00f3ff; }

        /* CYBER GRID CONTAINER FRAME CARD */
        @keyframes neonPulseGlow { 0% { border-color: rgba(2,132,199,0.3); box-shadow: 0 0 15px rgba(2,132,199,0.1); } 50% { border-color: #00f3ff; box-shadow: 0 0 35px rgba(0,243,255,0.4); } 100% { border-color: rgba(2,132,199,0.3); box-shadow: 0 0 10px rgba(2,132,199,0.1); } }
        .gateway-card { width: 420px; background: rgba(11, 19, 43, 0.80); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 2px solid #00f3ff; border-radius: 28px; padding: 45px 40px; position: relative; z-index: 10; animation: neonPulseGlow 4s infinite ease-in-out; }
        .gateway-tabs { display: flex; justify-content: space-around; margin-bottom: 35px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
        .gateway-tab { font-size: 18px; font-weight: bold; color: rgba(255,255,255,0.35); cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .gateway-tab.active-tab { color: #00f3ff; text-shadow: 0 0 12px #00f3ff; }
        
        .input-block { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; text-align: left; }
        .input-block label { font-size: 11px; font-weight: 700; color: #00f3ff; text-transform: uppercase; letter-spacing: 1.5px; }
        .gateway-input { background: rgba(255,255,255,0.04); border: 1px solid rgba(0,243,255,0.2); border-radius: 10px; padding: 14px; outline: none; width: 100%; color: #ffffff; font-size: 14px; transition: 0.3s; }
        .gateway-input:focus { border-color: #00f3ff; background: rgba(0,243,255,0.05); box-shadow: 0 0 15px rgba(0,243,255,0.25); }
        
        .submit-blueprint-btn { width: 100%; background: linear-gradient(135deg, #00f3ff 0%, #0284c7 100%); color: #040814; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,243,255,0.2); }
        .submit-blueprint-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,243,255,0.4); }

        @media (max-width: 480px) {
            .gateway-card { width: 90%; padding: 30px 20px; }
            .back-link { top: 20px; left: 20px; }
        }
    </style>
</head>
<body>
    <!-- INTERACTIVE COSMIC MILKY WAY PARTICLES DISPLAY LAYER -->
    <canvas id="milkyWayEngine"></canvas>

    <a href="index.html" class="back-link">&#8592; Return to Terminal</a>

    <div class="gateway-card">
        <div class="gateway-tabs">
            <span class="gateway-tab active-tab" id="loginTab" onclick="switchForm('login')">Sign In</span>
            <span class="gateway-tab" id="signupTab" onclick="switchForm('signup')">Sign Up</span>
        </div>
        <form id="gatewayForm" onsubmit="handleAuth(event)">
            <div class="input-block" id="usernameBlock" style="display: none;">
                <label>Choose Cyber Handle</label>
                <input type="text" class="gateway-input" placeholder="e.g., matrix_operator">
            </div>
            <div class="input-block">
                <label>Identity Network Mail</label>
                <input type="email" class="gateway-input" placeholder="name@thea.tech" required>
            </div>
            <div class="input-block">
                <label>Security Crypt Pass-key</label>
                <input type="password" class="gateway-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-blueprint-btn" id="gateBtn">Initialize Session</button>
        </form>
    </div>

    <script>
        /* MILKY WAY HIGH-CONTRAST NEON WAVES LOGIC ENGINE */
        const canvas = document.getElementById('milkyWayEngine');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let numParticles = window.innerWidth < 768 ? 40 : 110;

        function sizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', sizeCanvas);
        sizeCanvas();

        // Build cosmic particle coordinates array matrix
        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 0.8,
                angle: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.01 + 0.003,
                waveAmplitude: Math.random() * 15 + 5
            });
        }

        function animateMilkyWay() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.angle += p.speed;
                // Generate a continuous flowing cosmic wave vector calculation
                p.x += Math.cos(p.angle) * 0.3;
                p.y += Math.sin(p.angle) * 0.3 + (Math.sin(p.x * 0.01) * 0.05);

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                // Bright glowing electric neon particles transparency index mapping
                ctx.fillStyle = `rgba(0, 243, 255, ${Math.sin(p.angle) * 0.4 + 0.6})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00f3ff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // Clear shadow buffer context
            });
            requestAnimationFrame(animateMilkyWay);
        }
        animateMilkyWay();

        /* AUTH MODE SWITCH ENGINE PANEL */
        function switchForm(mode) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const userBlock = document.getElementById('usernameBlock');
            const btn = document.getElementById('gateBtn');
            
            if (mode === 'signup') {
                signupTab.classList.add('active-tab');
                loginTab.classList.remove('active-tab');
                userBlock.style.display = 'flex';
                btn.innerText = 'Register Cyber Handle';
            } else {
                loginTab.classList.add('active-tab');
                signupTab.classList.remove('active-tab');
                userBlock.style.display = 'none';
                btn.innerText = 'Initialize Session';
            }
        }

        /* LOCAL POPUP ALERT INTERACTION FOR TEST VALIDATIONS */
        function handleAuth(e) {
            e.preventDefault();
            alert('Access Authorized! Cyber session link mapped securely.');
        }
    </script>
</body>
</html>
