<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEA.TECH | Enterprise IT Software House & Global Consultancy</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* CORE RECOVERY & SYSTEM STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; scroll-behavior: smooth; }
        
        /* FIXED BACKGROUND ISSUE: Using solid high-end silver-to-light-blue gradient instead of unreliable web links */
        body { 
            background: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 50%, #dbeafe 100%); 
            color: #0f172a; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh; 
        }
        
        /* SMOOTH ATTRACTIVE NEON GLOW & FADE ANIMATIONS */
        @keyframes fadeGlow {
            0% { box-shadow: 0 0 15px rgba(2, 132, 199, 0.2); border-color: rgba(2, 132, 199, 0.2); }
            50% { box-shadow: 0 0 35px rgba(2, 132, 199, 0.6); border-color: #0284c7; }
            100% { box-shadow: 0 0 15px rgba(2, 132, 199, 0.2); border-color: rgba(2, 132, 199, 0.2); }
        }
        @keyframes floatEffect {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
        @keyframes slideInFade {
            0% { opacity: 0; transform: translateY(40px); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* 1. HIGH-FIDELITY NAVIGATION */
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-b: 1px solid #cbd5e1; padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 25px rgba(0,0,0,0.05); }
        .logo-box { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 45px; width: auto; object-fit: contain; }
        .logo-text { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .logo-text .blue { color: #0284c7; text-shadow: 0 0 10px rgba(2, 132, 199, 0.2); }
        .logo-text .dark { color: #0f172a; }
        
        nav a { color: #475569; text-decoration: none; margin-left: 30px; font-weight: 700; font-size: 15px; transition: 0.3s; position: relative; padding-bottom: 4px; }
        nav a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 3px; background-color: #0284c7; border-radius: 4px; transition: 0.3s; }
        nav a:hover::after, nav a.active::after { width: 100%; }
        nav a:hover, nav a.active { color: #0284c7; }
        
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .whatsapp-top { color: #16a34a; font-size: 26px; text-decoration: none; transition: 0.3s; }
        .whatsapp-top:hover { transform: scale(1.2); filter: drop-shadow(0 0 8px #22c55e); }

        /* MULTI-PAGE LARGE VIEWPORT CONFIGURATION */
        .section-viewport { padding: 120px 50px; max-width: 1400px; margin: 0 auto; border-bottom: 1px solid #cbd5e1; position: relative; z-index: 10; }
        .center-heading { text-align: center; max-width: 800px; margin: 0 auto 80px auto; animation: slideInFade 1s ease-out; }
        .center-heading h2 { font-size: 44px; font-weight: 800; color: #0f172a; margin-bottom: 15px; letter-spacing: -1px; }
        .center-heading p { color: #475569; font-size: 18px; line-height: 1.6; }

        /* 2. PREMIUM HERO SECTION */
        .hero-layout { display: flex; align-items: center; justify-content: space-between; gap: 60px; min-height: 75vh; }
        .hero-text { flex: 1.2; text-align: left; animation: slideInFade 1s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .hero-graphic { flex: 0.8; display: flex; justify-content: center; animation: slideInFade 1.3s ease-out; }
        
        .badge { background-color: rgba(2, 132, 199, 0.08); color: #0284c7; border: 1px solid rgba(2, 132, 199, 0.25); padding: 8px 18px; border-radius: 50px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; display: inline-block; margin-bottom: 25px; }
        h1 { font-size: 60px; font-weight: 900; color: #0f172a; line-height: 1.15; margin-bottom: 25px; letter-spacing: -1.5px; }
        h1 span { color: #0284c7; text-shadow: 0 4px 15px rgba(2, 132, 199, 0.15); }
        .hero-text p { font-size: 20px; color: #334155; line-height: 1.6; margin-bottom: 45px; max-width: 620px; }
        
        .btn-gradient { background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: #ffffff; padding: 16px 36px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; box-shadow: 0 8px 25px rgba(2, 132, 199, 0.25); font-size: 16px; }
        .btn-gradient:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(2, 132, 199, 0.4); }
        .btn-outline { border: 2px solid #cbd5e1; background-color: #ffffff; color: #334155; padding: 14px 34px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; margin-left: 20px; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .btn-outline:hover { background-color: #f8fafc; transform: translateY(-2px); border-color: #0284c7; }
        
        /* Dynamic Tech Abstract Floating Frame */
        .tech-box-frame { width: 360px; height: 360px; background-color: #ffffff; border: 2px solid rgba(2, 132, 199, 0.15); border-radius: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 60px rgba(0,0,0,0.05); animation: floatEffect 5s infinite ease-in-out, fadeGlow 4s infinite ease-in-out; }
        .tech-box-frame i { font-size: 130px; color: #0284c7; }

        /* METRICS STRIP */
        .metrics-bar { background-color: #ffffff; border-y: 1px solid #cbd5e1; padding: 60px 50px; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; }
        .metrics-layout { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; text-align: center; }
        .metric-item h3 { font-size: 48px; font-weight: 900; color: #0f172a; }
        .metric-item h3 span { color: #0284c7; }
        .metric-item p { font-size: 13px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 8px; letter-spacing: 1.5px; }

        /* 3. CORE 6+ SERVICE MATRIX GRID WITH FADE OVERLAYS */
        .services-matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 35px; }
        .service-card-node { background-color: #ffffff; border: 1px solid #cbd5e1; padding: 50px 40px; border-radius: 24px; text-align: left; transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: space-between; }
        .service-card-node:hover { transform: translateY(-12px); border-color: #0284c7; box-shadow: 0 25px 50px rgba(2, 132, 199, 0.12); }
        .service-icon-wrap { width: 65px; height: 65px; background-color: rgba(2, 132, 199, 0.06); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 35px; border: 1px solid rgba(2, 132, 199, 0.1); transition: 0.3s; }
        .service-icon-wrap i { font-size: 26px; color: #0284c7; }
        .service-card-node:hover .service-icon-wrap { background-color: #0284c7; border-color: #0284c7; transform: rotate(-6deg); }
        .service-card-node:hover .service-icon-wrap i { color: #ffffff; }
        .service-card-node h3 { color: #0f172a; font-size: 23px; margin-bottom: 15px; font-weight: 700; transition: 0.3s; }
        .service-card-node:hover h3 { color: #0284c7; }
        .service-card-node p { font-size: 15px; color: #475569; line-height: 1.6; }
        .service-vector-graphic { width: 100%; height: 130px; background-color: #f8fafc; border-radius: 12px; margin-top: 25px; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .service-card-node:hover .service-vector-graphic { border-color: rgba(2,132,199,0.3); background-color: rgba(2,132,199,0.02); }
        .service-vector-graphic i { font-size: 38px; color: #cbd5e1; transition: 0.3s; }
        .service-card-node:hover .service-vector-graphic i { color: #0284c7; transform: scale(1.08); }
        
        /* 4. BROAD ANIMATED ABOUT US IN SILVER MODE */
        .about-master-layout { display: flex; gap: 60px; align-items: center; text-align: left; background-color: #ffffff; padding: 60px; border-radius: 28px; border: 1px solid #cbd5e1; margin-top: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.02); }
        .about-narrative { flex: 1.2; }
        .about-narrative p { font-size: 17.5px; color: #475569; line-height: 1.7; margin-bottom: 25px; }
        .about-numerical-box { flex: 0.8; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); padding: 55px 40px; border-radius: 20px; border: 1px solid #cbd5e1; text-align: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .about-numerical-box h4 { font-size: 64px; color: #0f172a; font-weight: 900; letter-spacing: -1.5px; }
        .about-numerical-box p { color: #0284c7; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-top: 8px; letter-spacing: 2px; }

        /* 5. DYNAMIC HIGH-CONVERSION CONTACT FORM & CONTACT INTERACTIVE LINKS */
        .contact-card-architecture { display: flex; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 28px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.03); margin-top: 60px; text-align: left; }
