<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEA.TECH | Enterprise Software House & Global Technology Consultancy</title>
    <!-- Stable Icon Pack Delivery -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* CORPORATE HIGH-PERFORMANCE STYLE CONFIGURATION */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; scroll-behavior: smooth; }
        body { background-color: #f8fafc; color: #0f172a; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        
        /* ELITE INTERACTIVE KEYFRAMES */
        @keyframes slideInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatMotion {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes accentGlow {
            0% { box-shadow: 0 4px 20px rgba(2, 132, 199, 0.1); border-color: rgba(2, 132, 199, 0.2); }
            50% { box-shadow: 0 4px 30px rgba(2, 132, 199, 0.3); border-color: #0284c7; }
            100% { box-shadow: 0 4px 20px rgba(2, 132, 199, 0.1); border-color: rgba(2, 132, 199, 0.2); }
        }

        /* 1. ENTERPRISE TOP NAVIGATION HEADER */
        header { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 20px 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 30px rgba(0,0,0,0.02); }
        .logo-box { display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 26px; font-weight: 900; letter-spacing: 1px; }
        .logo-box .blue { color: #0284c7; }
        .logo-box .dark { color: #0f172a; }
        .logo-img { height: 45px; width: auto; object-fit: contain; }
        
        nav a { color: #475569; text-decoration: none; margin-left: 30px; font-weight: 700; font-size: 15px; transition: 0.3s; position: relative; padding-bottom: 4px; }
        nav a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background-color: #0284c7; transition: 0.3s; }
        nav a:hover::after, nav a.active::after { width: 100%; }
        nav a:hover, nav a.active { color: #0284c7; }
        
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .whatsapp-top { color: #22c55e; font-size: 26px; text-decoration: none; transition: 0.3s; }
        .whatsapp-top:hover { transform: scale(1.15); }

        /* MULTI-PAGE BROAD VIEWPORTS INTEGRITY */
        .viewport-section { padding: 120px 60px; max-width: 1400px; margin: 0 auto; border-bottom: 1px solid #e2e8f0; animation: slideInUp 0.8s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .viewport-section:last-of-type { border-bottom: none; }
        .section-header { text-align: center; max-width: 800px; margin: 0 auto 90px auto; }
        .section-header h2 { font-size: 42px; font-weight: 800; color: #0f172a; margin-bottom: 20px; letter-spacing: -1px; }
        .section-header p { color: #475569; font-size: 18px; line-height: 1.6; }

        /* 2. PREMIUM HERO SUITE */
        .hero-container { display: flex; align-items: center; justify-content: space-between; gap: 60px; min-height: 70vh; text-align: left; }
        .hero-text { flex: 1.2; }
        .hero-graphic { flex: 0.8; display: flex; justify-content: center; }
        
        .badge { background-color: rgba(2, 132, 199, 0.06); color: #0284c7; border: 1px solid rgba(2, 132, 199, 0.2); padding: 8px 18px; border-radius: 50px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 25px; }
        h1 { font-size: 58px; font-weight: 900; color: #0f172a; line-height: 1.15; margin-bottom: 25px; letter-spacing: -1.5px; }
        h1 span { color: #0284c7; }
        .hero-text p { font-size: 20px; color: #475569; margin-bottom: 45px; line-height: 1.6; }
        
        .btn-gradient { background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: #ffffff; padding: 16px 36px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; box-shadow: 0 8px 25px rgba(2, 132, 199, 0.2); }
        .btn-gradient:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(2, 132, 199, 0.35); }
        .btn-outline { border: 2px solid #cbd5e1; background-color: #ffffff; color: #334155; padding: 14px 34px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; margin-left: 20px; font-size: 16px; }
        .btn-outline:hover { background-color: #f8fafc; border-color: #0284c7; transform: translateY(-2px); }
        
        .graphic-node-frame { width: 340px; height: 340px; background-color: #ffffff; border: 2px solid rgba(2, 132, 199, 0.15); border-radius: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 60px rgba(0,0,0,0.04); animation: floatMotion 6s infinite ease-in-out, accentGlow 4s infinite ease-in-out; }
        .graphic-node-frame i { font-size: 120px; color: #0284c7; }

        /* 3. PERFORMANCE METRICS STRIP */
        .metrics-bar { background-color: #ffffff; border-y: 1px solid #cbd5e1; padding: 60px 50px; }
        .metrics-layout { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; text-align: center; }
        .metric-item h3 { font-size: 48px; font-weight: 900; color: #0f172a; }
        .metric-item h3 span { color: #0284c7; }
        .metric-item p { font-size: 13px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 8px; letter-spacing: 1px; }

        /* 4. RESTRUCTURED 5 CORE CORPORATE SERVICES SPECTRUM */
        .services-matrix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 35px; }
        .service-card-node { background-color: #ffffff; border: 1px solid #e2e8f0; padding: 50px 40px; border-radius: 24px; text-align: left; transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.01); display: flex; flex-direction: column; justify-content: space-between; }
        .service-card-node:hover { transform: translateY(-10px); border-color: #0284c7; box-shadow: 0 30px 60px rgba(2, 132, 199, 0.08); }
        .service-icon-wrap { width: 65px; height: 65px; background-color: rgba(2, 132, 199, 0.06); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; border: 1px solid rgba(2, 132, 199, 0.1); }
        .service-icon-wrap i { font-size: 26px; color: #0284c7; }
        .service-card-node h3 { color: #0f172a; font-size: 24px; margin-bottom: 15px; font-weight: 700; }
        .service-card-node p { font-size: 15.5px; color: #475569; line-height: 1.6; margin-bottom: 20px; }
        
        /* Global How It Works Sub-Layout */
        .service-workflow { background-color: #f8fafc; border-left: 4px solid #0284c7; padding: 20px; border-radius: 0 12px 12px 0; border: 1px solid #e2e8f0; border-left: 4px solid #0284c7; }
        .service-workflow strong { font-size: 13px; text-transform: uppercase; color: #0284c7; display: block; margin-bottom: 6px; letter-spacing: 0.5px; }
        .service-workflow span { font-size: 14.5px; color: #64748b; line-height: 1.6; display: block; }

        /* 5. BROAD SYSTEM INTEGRITY ABOUT COMPONENT */
        .about-master-layout { display: flex; gap: 60px; align-items: center; text-align: left; background-color: #ffffff; padding: 60px; border-radius: 28px; border: 1px solid #cbd5e1; box-shadow: 0 10px 40px rgba(0,0,0,0.01); }
        .about-narrative { flex: 1.2; }
        .about-narrative p { font-size: 18px; color: #475569; line-height: 1.7; margin-bottom: 25px; }
        .about-numerical-box { flex: 0.8; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); padding: 55px 40px; border-radius: 20px; border: 1px solid #cbd5e1; text-align: center; }
        .about-numerical-box h4 { font-size: 64px; color: #0f172a; font-weight: 900; }
        .about-numerical-box p { color: #0284c7; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-top: 8px; letter-spacing: 2px; }

        /* 6. STRATEGIC COOPERATION ADVANTAGES PARAMETERS */
        .features-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .feature-box { background-color: #ffffff; border: 1px solid #e2e8f0; padding: 40px 35px; border-radius: 20px; text-align: left; box-shadow: 0 4px 20px rgba(0,0,0,0.01); transition: 0.3s; }
        .feature-box:hover { border-color: #0284c7; transform: translateY(-4px); }
        .feature-box h4 { font-size: 20px; color: #0f172a; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
        .feature-box h4 i { color: #16a34a; }
        .feature-box p { font-size: 15px; color: #64748b; line-height: 1.6; }

        /* 7. SECURE CONVERSION MODULE TO GMAIL */
        .contact-card-box { display: flex; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 32px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.03); margin-top: 60px; text-align: left; }
        .contact-sidebar { flex: 0.85; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); padding: 60px; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; }
        .contact-form-side { flex: 1.15; padding: 60px; background-color: #ffffff; }
        
        .sidebar-title h3 { font-size: 36px; font-weight: 800; margin-bottom: 15px; }
        .sidebar-title p { color: #cbd5e1; font-size: 16px; line-height: 1.6; }
        .communication-nodes { margin: 40px 0; display: flex; flex-direction: column; gap: 25px; }
