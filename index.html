<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEA.TECH | Enterprise IT Software House & Global Consultancy</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* PREMIUM NEON GLOW ENGINE STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; scroll-behavior: smooth; }
        
        /* FIX BLANK BACKGROUND: Ensuring body always holds layout structured */
        body { background-color: #0b0f19; color: #cbd5e1; overflow-x: hidden; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        
        /* FADE & NEON KEYFRAMES ANIMATIONS */
        @keyframes neonGlow {
            0% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.2), inset 0 0 10px rgba(56, 189, 248, 0.1); }
            50% { box-shadow: 0 0 30px rgba(56, 189, 248, 0.6), inset 0 0 20px rgba(56, 189, 248, 0.3); border-color: #38bdf8; }
            100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.2), inset 0 0 10px rgba(56, 189, 248, 0.1); }
        }
        @keyframes fadeInRise {
            0% { opacity: 0; transform: translateY(30px); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes imagePulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(2,132,199,0.2)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(2,132,199,0.5)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(2,132,199,0.2)); }
        }

        /* 1. HIGH-END TOP NAVIGATION */
        header { background-color: rgba(9, 13, 22, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-b: 1px solid #1e293b; padding: 20px 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 30px rgba(0,0,0,0.3); }
        .logo-box { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo-img { height: 50px; width: auto; object-fit: contain; }
        .logo-text { font-size: 26px; font-weight: 900; letter-spacing: 1.5px; }
        .logo-text .blue { color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        .logo-text .white { color: #ffffff; }
        
        nav a { color: #94a3b8; text-decoration: none; margin-left: 35px; font-weight: 700; font-size: 16px; transition: 0.3s; position: relative; padding-bottom: 6px; }
        nav a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 3px; background-color: #38bdf8; border-radius: 4px; box-shadow: 0 0 10px #38bdf8; transition: 0.3s; }
        nav a:hover::after, nav a.active::after { width: 100%; }
        nav a:hover, nav a.active { color: #38bdf8; }
        
        .header-actions { display: flex; align-items: center; gap: 25px; }
        .whatsapp-top { color: #22c55e; font-size: 26px; text-decoration: none; transition: 0.3s; }
        .whatsapp-top:hover { transform: scale(1.2); filter: drop-shadow(0 0 10px #22c55e); }

        /* 2. DYNAMIC HERO SEC WITH EXECUTIVE CITY BACKDROP */
        .hero-viewport { 
            position: relative; 
            min-height: 95vh; 
            display: flex; 
            align-items: center; 
            background: linear-gradient(rgba(11, 15, 25, 0.8), rgba(11, 15, 25, 0.95)), 
                        url('https://unsplash.com') no-repeat center center; 
            background-size: cover; 
            padding: 120px 60px;
            border-bottom: 1px solid #1e293b;
        }
        .hero-layout { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 60px; width: 100%; position: relative; z-index: 10; }
        
        /* Fade In Entrance Effect */
        .hero-text { flex: 1.2; text-align: left; animation: floatUpFade 1.2s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .hero-graphic { flex: 0.8; display: flex; justify-content: center; animation: fadeInRise 1.5s ease-out; }
        
        .badge { background-color: rgba(56, 189, 248, 0.08); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 8px 20px; border-radius: 50px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; display: inline-block; margin-bottom: 30px; box-shadow: 0 0 15px rgba(56,189,248,0.15); }
        h1 { font-size: 64px; font-weight: 900; color: #ffffff; line-height: 1.1; margin-bottom: 30px; }
        h1 span { color: #38bdf8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        .hero-text p { font-size: 21px; color: #cbd5e1; line-height: 1.6; margin-bottom: 50px; max-width: 650px; }
        
        .btn-gradient { background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); color: #ffffff; padding: 18px 40px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); font-size: 16px; }
        .btn-gradient:hover { transform: translateY(-4px); box-shadow: 0 0 35px #38bdf8; }
        .btn-outline { border: 2px solid #334155; background-color: rgba(15, 23, 42, 0.6); color: #ffffff; padding: 16px 38px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; margin-left: 20px; font-size: 16px; }
        .btn-outline:hover { background-color: #1e293b; transform: translateY(-2px); border-color: #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.2); }
        
        /* 1st User Tech Image Frame With Neon Pulse */
        .tech-showcase-img-box { width: 440px; height: 300px; background: linear-gradient(rgba(15,23,42,0.4), rgba(15,23,42,0.4)), url('https://unsplash.com') no-repeat center center; background-size: cover; border: 2px solid rgba(56, 189, 248, 0.3); border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); animation: imagePulse 4s infinite ease-in-out, neonGlow 4s infinite ease-in-out; overflow: hidden; }

        /* METRICS BLOCK */
        .metrics-viewport { background-color: #070a12; border-b: 1px solid #1e293b; padding: 80px 60px; }
        .metrics-layout { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; text-align: center; }
        .metric-item h3 { font-size: 52px; font-weight: 900; color: #ffffff; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .metric-item h3 span { color: #38bdf8; }
        .metric-item p { font-size: 14px; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-top: 10px; letter-spacing: 1.5px; }

        /* BROAD SECTION STANDARDS WITH FADE SLIDE INS */
        .section-viewport { padding: 140px 60px; max-width: 1400px; margin: 0 auto; text-align: center; border-bottom: 1px solid #1e293b; }
        .center-heading { text-align: center; max-width: 800px; margin: 0 auto 90px auto; }
        .center-heading h2 { font-size: 46px; font-weight: 800; color: #ffffff; margin-bottom: 20px; letter-spacing: -1px; }
        .center-heading p { color: #94a3b8; font-size: 19px; line-height: 1.6; }

        /* 3. NEON SERVICES HOVER MATRIX GRID */
        .services-matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 35px; }
        .service-card-node { background-color: #0f172a; border: 1px solid #1e293b; padding: 50px 40px; border-radius: 24px; text-align: left; transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
        .service-card-node:hover { transform: translateY(-12px); border-color: #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.4); }
        .service-icon-wrap { width: 70px; height: 70px; background-color: rgba(56, 189, 248, 0.05); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 35px; border: 1px solid rgba(56, 189, 248, 0.15); transition: 0.3s; }
        .service-icon-wrap i { font-size: 28px; color: #38bdf8; }
        .service-card-node:hover .service-icon-wrap { background-color: #38bdf8; border-color: #38bdf8; transform: rotate(-6deg); box-shadow: 0 0 15px #38bdf8; }
        .service-card-node:hover .service-icon-wrap i { color: #0b0f19; }
        .service-card-node h3 { color: #ffffff; font-size: 24px; margin-bottom: 15px; font-weight: 700; transition: 0.3s; }
        .service-card-node:hover h3 { color: #38bdf8; }
        .service-card-node p { font-size: 15.5px; color: #cbd5e1; line-height: 1.6; }
        
        /* 4. BROAD ANIMATED ABOUT EXPANSION INTEGRATING IMAGE 3 */
        .about-master-layout { display: flex; gap: 80px; align-items: center; text-align: left; background-color: #090d16; padding: 70px; border-radius: 32px; border: 1px solid #1e293b; margin-top: 50px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        .about-narrative { flex: 1.1; }
        .about-narrative p { font-size: 18px; color: #cbd5e1; line-height: 1.7; margin-bottom: 30px; }
        
        /* 3rd User Image (City Skyline Executive Reflection Frame) */
        .about-numerical-box-skyline { flex: 0.9; height: 380px; background: linear-gradient(rgba(11,15,25,0.2), rgba(11,15,25,0.5)), url('https://unsplash.com') no-repeat center center; background-size: cover; border-radius: 24px; border: 2px solid rgba(56, 189, 248, 0.2); display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transition: 0.4s; }
        .about-numerical-box-skyline:hover { border-color: #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); transform: scale(1.02); }
