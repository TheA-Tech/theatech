<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEA.TECH | Enterprise IT Software House & Global Consultancy</title>
    <!-- Stable Icon Pack Delivery -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* 100% UN-CRASHABLE SOLID EMBEDDED ENGINE CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; scroll-behavior: smooth; }
        
        /* Premium Light Metallic Silver & Sky Blue Color Palette */
        body { background-color: #f1f5f9; color: #1e293b; overflow-x: hidden; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        
        /* SOLID HOVER ANIMATIONS */
        @keyframes floatUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes pulseGlow { 0% { box-shadow: 0 4px 15px rgba(2,132,199,0.1); } 50% { box-shadow: 0 4px 25px rgba(2,132,199,0.3); border-color: #0284c7; } 100% { box-shadow: 0 4px 15px rgba(2,132,199,0.1); } }

        /* 1. STABLE TOP NAV BAR MODULE */
        header { background-color: #ffffff; border-bottom: 1px solid #cbd5e1; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .logo-box { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 45px; width: auto; object-fit: contain; }
        .logo-text { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .logo-text .blue { color: #0284c7; }
        .logo-text .dark { color: #0f172a; }
        
        nav a { color: #64748b; text-decoration: none; margin-left: 25px; font-weight: 700; font-size: 15px; transition: 0.3s; position: relative; padding-bottom: 4px; }
        nav a:hover, nav a.active { color: #0284c7; }
        nav a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background-color: #0284c7; transition: 0.3s; }
        nav a:hover::after { width: 100%; }
        
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .whatsapp-top { color: #16a34a; font-size: 26px; text-decoration: none; transition: 0.3s; }
        .whatsapp-top:hover { transform: scale(1.15); }

        /* MULTI-PAGE BROAD SECTIONS VIEWPORTS */
        .section-viewport { padding: 120px 50px; max-width: 1400px; margin: 0 auto; border-bottom: 1px solid #e2e8f0; animation: floatUp 0.8s ease-out; }
        .center-heading { text-align: center; max-width: 800px; margin: 0 auto 80px auto; }
        .center-heading h2 { font-size: 42px; font-weight: 800; color: #0f172a; margin-bottom: 15px; letter-spacing: -1px; }
        .center-heading p { color: #475569; font-size: 18px; line-height: 1.6; }

        /* 2. DYNAMIC BROAD HERO COMPONENT */
        .hero-layout { display: flex; align-items: center; justify-content: space-between; gap: 60px; min-height: 70vh; text-align: left; }
        .hero-text { flex: 1.2; }
        .hero-graphic { flex: 0.8; display: flex; justify-content: center; }
        
        .badge { background-color: rgba(2, 132, 199, 0.06); color: #0284c7; border: 1px solid rgba(2, 132, 199, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 25px; }
        h1 { font-size: 56px; font-weight: 900; color: #0f172a; line-height: 1.15; margin-bottom: 25px; }
        h1 span { color: #0284c7; }
        .hero-text p { font-size: 20px; color: #475569; margin-bottom: 40px; line-height: 1.6; }
        
        .btn-gradient { background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: #ffffff; padding: 16px 36px; border-radius: 10px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; box-shadow: 0 8px 20px rgba(2,132,199,0.15); }
        .btn-gradient:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(2,132,199,0.3); }
        .btn-outline { border: 2px solid #cbd5e1; background-color: #ffffff; color: #334155; padding: 14px 34px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; margin-left: 15px; }
        .btn-outline:hover { background-color: #f8fafc; border-color: #0284c7; }
        
        .tech-box-graphic { width: 340px; height: 340px; background-color: #ffffff; border: 2px solid rgba(2,132,199,0.15); border-radius: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(0,0,0,0.03); animation: pulseGlow 4s infinite ease-in-out; }
        .tech-box-graphic i { font-size: 120px; color: #0284c7; }

        /* 3. CORE METRICS STRIP */
        .metrics-bar { background-color: #ffffff; border-y: 1px solid #cbd5e1; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; padding: 55px 40px; }
        .metrics-layout { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; text-align: center; }
        .metric-item h3 { font-size: 46px; font-weight: 800; color: #0f172a; }
        .metric-item h3 span { color: #0284c7; }
        .metric-item p { font-size: 13px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 5px; letter-spacing: 1px; }

        /* 4. EXPANDED CORE SERVICES GRID (2x2 Structure layout) */
        .services-layout-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 35px; }
        .service-node { background-color: #ffffff; border: 1px solid #e2e8f0; padding: 45px 35px; border-radius: 24px; text-align: left; transition: 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.01); display: flex; flex-direction: column; justify-content: space-between; }
        .service-node:hover { transform: translateY(-8px); border-color: #0284c7; box-shadow: 0 20px 40px rgba(2,132,199,0.08); }
        .service-node-top { display: flex; flex-direction: column; }
        .service-node-icon { width: 60px; height: 60px; background-color: rgba(2, 132, 199, 0.06); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; border: 1px solid rgba(2, 132, 199, 0.1); }
        .service-node-icon i { font-size: 24px; color: #0284c7; }
        .service-node h3 { color: #0f172a; font-size: 24px; margin-bottom: 12px; font-weight: 700; }
        .service-node p { font-size: 15px; color: #475569; line-height: 1.6; margin-bottom: 15px; }
        .service-how-it-works { background-color: #f8fafc; border-left: 3px solid #0284c7; padding: 15px; border-radius: 0 8px 8px 0; margin-top: 10px; }
        .service-how-it-works strong { font-size: 13px; text-transform: uppercase; color: #0284c7; display: block; margin-bottom: 5px; letter-spacing: 0.5px; }
        .service-how-it-works span { font-size: 14px; color: #64748b; line-height: 1.5; }

        /* 5. BROAD DETAILED ABOUT SECTION */
        .about-master-layout { display: flex; gap: 60px; align-items: center; text-align: left; background-color: #ffffff; padding: 60px; border-radius: 24px; border: 1px solid #cbd5e1; margin-top: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.01); }
        .about-narrative { flex: 1.2; }
        .about-narrative p { font-size: 17.5px; color: #475569; line-height: 1.7; margin-bottom: 25px; }
        .about-numerical-box { flex: 0.8; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); padding: 55px 40px; border-radius: 20px; border: 1px solid #cbd5e1; text-align: center; }
        .about-numerical-box h4 { font-size: 64px; color: #0f172a; font-weight: 900; }
        .about-numerical-box p { color: #0284c7; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-top: 8px; letter-spacing: 2px; }

        /* 6. CORE VALUES / PARAMETERS */
        .features-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .feature-box { background-color: #ffffff; border: 1px solid #e2e8f0; padding: 35px; border-radius: 16px; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.01); }
        .feature-box:hover { border-color: #0284c7; }
        .feature-box h4 { font-size: 19px; color: #0f172a; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
        .feature-box h4 i { color: #16a34a; }
        .feature-box p { font-size: 14.5px; color: #64748b; line-height: 1.6; }

        /* 7. COMPREHENSIVE CONVERSION CONTACT MODULE TO GMAIL */
        .contact-card-box { display: flex; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 28px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.03); margin-top: 50px; text-align: left; }
        .contact-sidebar { flex: 0.85; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); padding: 60px; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; }
        .contact-form-side { flex: 1.15; padding: 60px; background-color: #ffffff; }
        .sidebar-title h3 { font-size: 34px; font-weight: 800; margin-bottom: 15px; }
        .sidebar-title p { color: #cbd5e1; font-size: 15.5px; line-height: 1.6; }
        .communication-nodes { margin: 40px 0; display: flex; flex-direction: column; gap: 25px; }
        .node-row { display: flex; align-items: center; gap: 18px; text-decoration: none; color: inherit; font-size: 15.5px; font-weight: 600; transition: 0.3s; }
        .node-row:hover { transform: translateX(5px); color: #38bdf8; }
        .node-row i { width: 44px; height: 44px; background-color: rgba(255, 255, 255, 0.06); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #38bdf8; font-size: 18px; border: 1px solid rgba(255,255,255,0.08); }
        .node-row.wp-node i { color: #25d366; }
