<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEA.TECH | Enterprise Software House</title>
    <style>
        /* 100% SECURE EMBEDDED CSS ENGINE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; scroll-behavior: smooth; }
        body { background-color: #f1f5f9; color: #1e293b; line-height: 1.6; }
        
        /* ADVANCED NEON GLOW & KINETIC FADE ANIMATIONS */
        @keyframes fadeGlow {
            0% { box-shadow: 0 0 15px rgba(2,132,199,0.2); border-color: rgba(2,132,199,0.2); }
            50% { box-shadow: 0 0 35px #0284c7; border-color: #0284c7; }
            100% { box-shadow: 0 0 15px rgba(2,132,199,0.2); border-color: rgba(2,132,199,0.2); }
        }
        @keyframes skylineRise {
            0% { transform: translateY(10px); opacity: 0.7; }
            50% { transform: translateY(0px); opacity: 1; }
            100% { transform: translateY(10px); opacity: 0.7; }
        }
        
        /* HEADER NAV */
        header { background-color: #ffffff; border-bottom: 1px solid #cbd5e1; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .logo-box { font-size: 24px; font-weight: 900; text-decoration: none; }
        .logo-box .blue { color: #0284c7; text-shadow: 0 0 10px rgba(2,132,199,0.3); }
        .logo-box .dark { color: #0f172a; }
        nav a { color: #64748b; text-decoration: none; margin-left: 25px; font-weight: 700; font-size: 15px; }
        nav a:hover { color: #0284c7; }

        /* MULTI-SECTION VIEWPORTS WRAPPERS */
        .section-viewport { padding: 120px 40px; max-width: 1200px; margin: 0 auto; border-bottom: 1px solid #e2e8f0; text-align: center; }
        .center-heading { margin-bottom: 60px; }
        .center-heading h2 { font-size: 40px; font-weight: 800; color: #0f172a; margin-bottom: 15px; letter-spacing: -1px; }
        .center-heading p { color: #475569; font-size: 18px; }

        /* HERO AREA */
        .hero-layout { display: flex; align-items: center; justify-content: space-between; gap: 40px; min-height: 60vh; text-align: left; }
        .hero-text { flex: 1.2; } .hero-graphic { flex: 0.8; display: flex; justify-content: center; }
        .badge { background-color: rgba(2, 132, 199, 0.06); color: #0284c7; border: 1px solid rgba(2, 132, 199, 0.2); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 20px; }
        h1 { font-size: 52px; font-weight: 900; color: #0f172a; line-height: 1.15; margin-bottom: 20px; }
        h1 span { color: #0284c7; }
        .hero-text p { font-size: 19px; color: #475569; margin-bottom: 35px; }
        
        .btn-gradient { background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: #ffffff; padding: 14px 32px; border-radius: 8px; font-weight: 700; text-decoration: none; display: inline-block; box-shadow: 0 6px 15px rgba(2,132,199,0.2); }
        .btn-gradient:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(2,132,199,0.35); }
        .btn-outline { border: 2px solid #cbd5e1; background-color: #ffffff; color: #334155; padding: 12px 30px; border-radius: 8px; font-weight: 700; text-decoration: none; display: inline-block; margin-left: 15px; }
        .btn-outline:hover { background-color: #f8fafc; border-color: #0284c7; }

        /* PURE CSS CITY SKYLINE FLUID PRESENTATION GRAPHIC */
        .skyline-container { width: 340px; height: 340px; background-color: #0f172a; border-radius: 28px; position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; box-shadow: 0 25px 50px rgba(0,0,0,0.15); animation: fadeGlow 4s infinite ease-in-out; }
        .skyline-grid-mesh { position: absolute; inset: 0; background-image: linear-gradient(rgba(56,189,248,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(56,189,248,0.1) 1px, transparent 1px); background-size: 20px 20px; }
        .skyline-buildings { width: 90%; height: 60%; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; position: relative; z-index: 5; animation: skylineRise 5s infinite ease-in-out; }
        .building { background: linear-gradient(to top, #1e293b, #0284c7); border-radius: 6px 6px 0 0; position: relative; }
        .building::before { content: '.. .. .. ..'; position: absolute; top: 10px; left: 5px; color: rgba(255,255,255,0.3); font-size: 10px; letter-spacing: 2px; line-height: 12px; word-break: break-all; width: 80%; }
        .b1 { width: 45px; height: 85%; } .b2 { width: 55px; height: 100%; background: linear-gradient(to top, #0f172a, #38bdf8); } .b3 { width: 40px; height: 70%; } .b4 { width: 50px; height: 90%; }
        .skyline-glow-core { position: absolute; width: 140px; height: 140px; background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, transparent 70%); top: 20%; left: 20%; filter: blur(10px); }

        /* METRICS BLOCK */
        .metrics-bar { background-color: #ffffff; border-y: 1px solid #cbd5e1; padding: 50px 40px; }
        .metrics-layout { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; }
        .metric-item h3 { font-size: 40px; font-weight: 800; color: #0f172a; }
        .metric-item p { font-size: 13px; color: #64748b; text-transform: uppercase; margin-top: 5px; font-weight: 700; }

        /* 5 CORE SERVICES RESPONSIVE NODES */
        .services-layout-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; text-align: left; }
        .service-node { background-color: #ffffff; border: 1px solid #cbd5e1; padding: 40px; border-radius: 20px; transition: 0.3s; }
        .service-node:hover { border-color: #0284c7; transform: translateY(-5px); box-shadow: 0 15px 30px rgba(2,132,199,0.06); }
        .service-node h3 { color: #0f172a; font-size: 22px; margin-bottom: 12px; font-weight: 700; border-left: 4px solid #0284c7; padding-left: 12px; }
        .service-node p { font-size: 15px; color: #475569; margin-bottom: 15px; }
        .service-how { background-color: #f8fafc; padding: 15px; border-radius: 8px; font-size: 14px; color: #64748b; border: 1px dashed #cbd5e1; }
        .service-how strong { color: #0284c7; display: block; margin-bottom: 4px; }

        /* ABOUT MASTER LAYER */
        .about-master-layout { display: flex; gap: 50px; align-items: center; text-align: left; background-color: #ffffff; padding: 50px; border-radius: 20px; border: 1px solid #cbd5e1; }
        .about-narrative { flex: 1.3; font-size: 17px; color: #475569; }
        .about-numerical-box { flex: 0.7; background: #f8fafc; padding: 40px; border-radius: 16px; border: 1px solid #cbd5e1; text-align: center; }
        .about-numerical-box h4 { font-size: 56px; font-weight: 900; color: #0f172a; }
        .about-numerical-box p { color: #0284c7; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-top: 5px; }

        /* CONTACT FORM GRID AND CHANNELS TO GMAIL */
        .contact-card-box { display: flex; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 24px; overflow: hidden; margin-top: 40px; text-align: left; box-shadow: 0 15px 40px rgba(0,0,0,0.02); }
        .contact-sidebar { flex: 0.8; background: #0f172a; padding: 50px; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; }
        .contact-form-side { flex: 1.2; padding: 50px; background-color: #ffffff; }
        .communication-nodes { margin: 30px 0; display: flex; flex-direction: column; gap: 20px; }
        .node-row { color: #38bdf8; text-decoration: none; font-size: 15px; font-weight: 600; display: block; }
        .node-row.wp { color: #22c55e; }
        .social-matrix-row a { color: #94a3b8; font-size: 15px; margin-right: 15px; text-decoration: none; font-weight: bold; }
        .social-matrix-row a:hover { color: #38bdf8; }
        
        .grid-split-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-block { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .input-block label { font-size: 12px; font-weight: 700; color: #0284c7; text-transform: uppercase; }
        .input-block input, .input-block select, .input-block textarea { background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; color: #0f172a; font-size: 14px; outline: none; width: 100%; }
        .input-block input:focus, .input-block select:focus, .input-block textarea:focus { border-color: #0284c7; }
        .submit-blueprint-btn { width: 100%; background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 15px rgba(2,132,199,0.15); }

        footer { background-color: #ffffff; border-top: 1px solid #cbd5e1; padding: 40px; text-align: center; color: #64748b; font-size: 14px; }
        @media (max-width: 1100px) { .services-layout-grid, .hero-layout, .about-master-layout, .contact-card-box, .grid-split-2 { grid-template-columns: 1fr; flex-direction: column; text-align: center; } .hero-text { text-align: center; } .contact-sidebar { border-bottom: 1px solid #cbd5e1; } .btn-outline { margin-left: 0; margin-top: 15px; } }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-box"><span class="blue">THEA</span><span class="dark">.TECH</span></a>
        <nav>
            <a href="#home-view">Home</a>
            <a href="#services-view">Services</a>
            <a href="#about-view">About</a>
            <a href="#contact-view">Contact</a>
        </nav>
    </header>
