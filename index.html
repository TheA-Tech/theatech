<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEA.TECH | Enterprise IT Software House & Global Consultancy</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* PURE MODERN LIGHT METALLIC SPECIFICATIONS */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; scroll-behavior: smooth; }
        
        /* FIXED LAYOUT ISSUE: Using a stable, unblockable solid light metallic color */
        body { 
            background-color: #f1f5f9; 
            color: #0f172a; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh; 
        }
        
        /* ATTRACTIVE DYNAMIC HOVER EFFECTS */
        @keyframes floatUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        /* 1. TOP NAVIGATION HEADER */
        header { background-color: #ffffff; border-bottom: 1px solid #cbd5e1; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .logo-box { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 45px; width: auto; object-fit: contain; }
        .logo-text { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .logo-text .blue { color: #0284c7; }
        .logo-text .dark { color: #0f172a; }
        
        nav a { color: #475569; text-decoration: none; margin-left: 25px; font-weight: 700; font-size: 15px; transition: 0.3s; }
        nav a:hover, nav a.active { color: #0284c7; }
        
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .whatsapp-top { color: #16a34a; font-size: 26px; text-decoration: none; transition: 0.3s; }
        .whatsapp-top:hover { transform: scale(1.15); }

        /* MULTI-PAGE VIEWPORT STRUCTURE */
        .section-viewport { padding: 100px 40px; max-width: 1300px; margin: 0 auto; border-bottom: 1px solid #cbd5e1; animation: floatUp 0.6s ease-out; }
        .center-heading { text-align: center; max-width: 750px; margin: 0 auto 70px auto; }
        .center-heading h2 { font-size: 40px; font-weight: 800; color: #0f172a; margin-bottom: 15px; }
        .center-heading p { color: #475569; font-size: 17px; line-height: 1.6; }

        /* 2. PREMIUM HERO SECTION */
        .hero-layout { display: flex; align-items: center; justify-content: space-between; gap: 50px; min-height: 65vh; text-align: left; }
        .hero-text { flex: 1.2; }
        .hero-graphic { flex: 0.8; display: flex; justify-content: center; }
        
        .badge { background-color: rgba(2, 132, 199, 0.06); color: #0284c7; border: 1px solid rgba(2, 132, 199, 0.2); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 20px; }
        h1 { font-size: 52px; font-weight: 900; color: #0f172a; line-height: 1.15; margin-bottom: 20px; }
        h1 span { color: #0284c7; }
        .hero-text p { font-size: 19px; color: #475569; margin-bottom: 35px; line-height: 1.6; }
        
        .btn-gradient { background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: #ffffff; padding: 14px 32px; border-radius: 8px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; box-shadow: 0 8px 20px rgba(2,132,199,0.15); }
        .btn-gradient:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(2,132,199,0.3); }
        .btn-outline { border: 2px solid #cbd5e1; background-color: #ffffff; color: #334155; padding: 12px 30px; border-radius: 8px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; margin-left: 15px; }
        .btn-outline:hover { background-color: #f8fafc; border-color: #0284c7; }
        
        .tech-box-graphic { width: 320px; height: 320px; background-color: #ffffff; border: 2px solid rgba(2,132,199,0.15); border-radius: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(0,0,0,0.03); }
        .tech-box-graphic i { font-size: 120px; color: #0284c7; }

        /* METRICS BAR */
        .metrics-bar { background-color: #ffffff; border-y: 1px solid #cbd5e1; padding: 50px 40px; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; }
        .metrics-layout { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; text-align: center; }
        .metric-item h3 { font-size: 44px; font-weight: 800; color: #0f172a; }
        .metric-item h3 span { color: #0284c7; }
        .metric-item p { font-size: 13px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 5px; }

        /* 3. 6+ Core Services Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 50px; }
        .card { background-color: #ffffff; border: 1px solid #cbd5e1; padding: 40px 30px; border-radius: 16px; text-align: left; transition: 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.01); }
        .card:hover { transform: translateY(-5px); border-color: #0284c7; box-shadow: 0 20px 40px rgba(2,132,199,0.08); }
        .card i { font-size: 32px; color: #0284c7; margin-bottom: 20px; display: block; }
        .card h3 { font-size: 21px; color: #0f172a; margin-bottom: 12px; }
        .card p { font-size: 14.5px; color: #475569; line-height: 1.6; }
        
        /* ABOUT SPECS */
        .about-master-layout { display: flex; gap: 50px; align-items: center; text-align: left; background-color: #ffffff; padding: 50px; border-radius: 20px; border: 1px solid #cbd5e1; margin-top: 40px; }
        .about-narrative { flex: 1.3; }
        .about-narrative p { font-size: 17px; color: #475569; line-height: 1.7; margin-bottom: 20px; }
        .about-numerical-box { flex: 0.7; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); padding: 50px 30px; border-radius: 16px; border: 1px solid #cbd5e1; text-align: center; }
        .about-numerical-box h4 { font-size: 60px; color: #0f172a; font-weight: 900; }
        .about-numerical-box p { color: #0284c7; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-top: 5px; }

        /* CONTACT MODULAR FRAME TO GMAIL */
        .contact-card-architecture { display: flex; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.03); margin-top: 50px; text-align: left; }
        .contact-brand-sidebar { flex: 0.85; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); padding: 50px; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; }
        .contact-inputs-area { flex: 1.15; padding: 50px; background-color: #ffffff; }
        .sidebar-title h3 { font-size: 30px; margin-bottom: 12px; }
        .communication-nodes { margin: 30px 0; display: flex; flex-direction: column; gap: 25px; }
        .node-row { display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit; font-size: 15px; font-weight: 600; }
        .node-row i { width: 40px; height: 40px; background-color: rgba(255, 255, 255, 0.08); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #38bdf8; }
        .node-row.wp-node i { color: #25d366; }
        .social-matrix-row a { color: #94a3b8; font-size: 22px; margin-right: 20px; text-decoration: none; transition: 0.3s; }
        .social-matrix-row a:hover { color: #38bdf8; }
        
        .grid-split-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-block { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .input-block label { font-size: 12px; font-weight: 700; color: #0284c7; text-transform: uppercase; }
        .input-block input, .input-block select, .input-block textarea { background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; color: #0f172a; font-size: 14px; outline: none; width: 100%; }
        .input-block input:focus, .input-block select:focus, .input-block textarea:focus { border-color: #0284c7; background-color: #ffffff; }
        .submit-blueprint-btn { width: 100%; background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(2,132,199,0.15); }

        footer { background-color: #ffffff; border-top: 1px solid #cbd5e1; padding: 40px; text-align: center; color: #64748b; font-size: 14px; }
        
        @media (max-width: 1100px) { .grid { grid-template-columns: 1fr 1fr; } .hero-layout, .about-master-layout, .contact-card-architecture { flex-direction: column; text-align: center; } .hero-layout { text-align: center; } .grid-split-2 { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { h1 { font-size: 38px; } .grid { grid-template-columns: 1fr; } .metrics-layout { grid-template-columns: 1fr 1fr; } header { flex-direction: column; gap: 15px; } nav a { margin: 0 10px; } }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-box">
            <img src="logo.png" alt="THEA.TECH Logo" class="logo-img" onerror="this.style.display='none';">
            <div class="logo-text"><span class="blue">THEA</span><span class="dark">.TECH</span></div>
        </a>
        <nav>
            <a href="#home-view">Home</a>
            <a href="#services-view">Services</a>
            <a href="#about-view">About</a>
            <a href="#contact-view">Contact</a>
        </nav>
        <div class="header-actions">
