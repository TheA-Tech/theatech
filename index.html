<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEA.TECH | Enterprise IT Software House & Global Consultancy</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* PREMIUM CORPORATE ENGINE STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; scroll-behavior: smooth; }
        body { background-color: #f8fafc; color: #0f172a; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        /* MODERN GLASS-MORPHISM & TRANSITIONS */
        @keyframes floatEffect {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes subtlePulse {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        /* 1. ULTRA-PREMIUM NAVIGATION HEADER */
        header { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-b: 1px solid #e2e8f0; padding: 20px 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 30px rgba(0,0,0,0.03); }
        .logo-box { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo-img { height: 50px; width: auto; object-fit: contain; transition: 0.3s; }
        .logo-box:hover .logo-img { transform: scale(1.08) rotate(-1deg); }
        .logo-text { font-size: 26px; font-weight: 900; letter-spacing: 1.5px; }
        .logo-text .blue { color: #0284c7; }
        .logo-text .dark { color: #0f172a; }
        
        nav a { color: #475569; text-decoration: none; margin-left: 35px; font-weight: 700; font-size: 16px; transition: 0.3s; position: relative; padding-bottom: 6px; }
        nav a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 3px; background-color: #0284c7; border-radius: 4px; transition: 0.3s; }
        nav a:hover::after, nav a.active::after { width: 100%; }
        nav a:hover, nav a.active { color: #0284c7; }
        
        .header-actions { display: flex; align-items: center; gap: 25px; }
        .whatsapp-top { color: #22c55e; font-size: 26px; text-decoration: none; transition: 0.3s; }
        .whatsapp-top:hover { transform: scale(1.2); filter: drop-shadow(0 0 10px rgba(34,197,94,0.3)); }

        /* HERO FULL-SCREEN EXPERIENCE */
        .hero-viewport { background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%); padding: 140px 60px; min-height: 90vh; display: flex; align-items: center; position: relative; overflow: hidden; border-bottom: 1px solid #e2e8f0; }
        .glow-sphere { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(2, 132, 199, 0.07) 0%, transparent 70%); top: -15%; right: -5%; z-index: 1; animation: subtlePulse 8s infinite ease-in-out; pointer-events: none; }
        .hero-layout { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 80px; width: 100%; position: relative; z-index: 10; }
        .hero-text { flex: 1.2; text-align: left; }
        .hero-graphic { flex: 0.8; display: flex; justify-content: center; }
        
        .badge { background-color: rgba(2, 132, 199, 0.08); color: #0284c7; border: 1px solid rgba(2, 132, 199, 0.2); padding: 8px 20px; border-radius: 50px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; display: inline-block; margin-bottom: 30px; }
        h1 { font-size: 64px; font-weight: 900; color: #0f172a; line-height: 1.1; letter-spacing: -1.5px; margin-bottom: 30px; }
        h1 span { background: linear-gradient(to right, #0284c7, #1d4ed8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: #0284c7; }
        .hero-text p { font-size: 21px; color: #475569; line-height: 1.6; margin-bottom: 50px; max-width: 650px; }
        
        .btn-gradient { background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: #ffffff; padding: 18px 40px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.25); font-size: 16px; }
        .btn-gradient:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(2, 132, 199, 0.4); }
        .btn-outline { border: 2px solid #cbd5e1; background-color: #ffffff; color: #334155; padding: 16px 38px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; margin-left: 20px; font-size: 16px; }
        .btn-outline:hover { background-color: #f8fafc; color: #0f172a; transform: translateY(-2px); border-color: #94a3b8; }
        
        .tech-showcase-box { width: 380px; height: 380px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 60px rgba(0,0,0,0.04); position: relative; animation: floatEffect 5s infinite ease-in-out; }
        .tech-showcase-box i { font-size: 140px; color: #0284c7; filter: drop-shadow(0 10px 20px rgba(2,132,199,0.15)); }

        /* METRICS BLOCK */
        .metrics-viewport { background-color: #ffffff; border-b: 1px solid #e2e8f0; padding: 80px 60px; }
        .metrics-layout { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; text-align: center; }
        .metric-item h3 { font-size: 52px; font-weight: 900; color: #0f172a; }
        .metric-item h3 span { color: #0284c7; }
        .metric-item p { font-size: 14px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 10px; letter-spacing: 1.5px; }

        /* BROAD SECTION STANDARDS */
        .section-viewport { padding: 140px 60px; max-width: 1400px; margin: 0 auto; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .center-heading { text-align: center; max-width: 800px; margin: 0 auto 90px auto; }
        .center-heading h2 { font-size: 46px; font-weight: 800; color: #0f172a; margin-bottom: 20px; letter-spacing: -1px; }
        .center-heading p { color: #475569; font-size: 19px; line-height: 1.6; }

        /* EXPANDED IT SERVICES MODULE */
        .services-matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 35px; }
        .service-card-node { background-color: #ffffff; border: 1px solid #e2e8f0; padding: 50px 40px; border-radius: 24px; text-align: left; transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.01); display: flex; flex-direction: column; justify-content: space-between; }
        .service-card-node:hover { transform: translateY(-12px); border-color: #0284c7; box-shadow: 0 40px 70px rgba(2, 132, 199, 0.08); }
        .service-icon-wrap { width: 70px; height: 70px; background-color: rgba(2, 132, 199, 0.05); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 35px; border: 1px solid rgba(2, 132, 199, 0.08); transition: 0.3s; }
        .service-icon-wrap i { font-size: 28px; color: #0284c7; }
        .service-card-node:hover .service-icon-wrap { background-color: #0284c7; border-color: #0284c7; transform: rotate(-6deg); }
        .service-card-node:hover .service-icon-wrap i { color: #ffffff; }
        .service-card-node h3 { color: #0f172a; font-size: 24px; margin-bottom: 15px; font-weight: 700; transition: 0.3s; }
        .service-card-node:hover h3 { color: #0284c7; }
        .service-card-node p { font-size: 15.5px; color: #475569; line-height: 1.6; }
        
        /* BROAD ANIMATED ABOUT EXPANSION */
        .about-master-layout { display: flex; gap: 80px; align-items: center; text-align: left; background-color: #ffffff; padding: 70px; border-radius: 32px; border: 1px solid #e2e8f0; margin-top: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.01); }
        .about-narrative { flex: 1.3; }
        .about-narrative p { font-size: 18px; color: #475569; line-height: 1.7; margin-bottom: 30px; }
        .about-numerical-box { flex: 0.7; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); padding: 60px 40px; border-radius: 24px; border: 1px solid #cbd5e1; text-align: center; }
        .about-numerical-box h4 { font-size: 72px; color: #0f172a; font-weight: 900; letter-spacing: -2px; }
        .about-numerical-box p { color: #0284c7; font-weight: 700; font-size: 13px; text-transform: uppercase; margin-top: 10px; letter-spacing: 2px; }

        /* DYNAMIC FORM & COMPLETE SOCIAL ANCHOR MATRIX */
        .contact-card-architecture { display: flex; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 32px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,0.04); margin-top: 60px; text-align: left; }
        .contact-brand-sidebar { flex: 0.9; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); padding: 70px; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; }
        .contact-inputs-area { flex: 1.1; padding: 70px; }
        
        .sidebar-title h3 { font-size: 38px; color: #ffffff; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.5px; }
        .sidebar-title p { color: #cbd5e1; font-size: 16px; line-height: 1.6; }
        
        .communication-nodes { margin: 45px 0; display: flex; flex-direction: column; gap: 30px; }
        .node-row { display: flex; align-items: center; gap: 20px; text-decoration: none; color: inherit; font-size: 16px; font-weight: 600; transition: 0.3s; }
        .node-row:hover { transform: translateX(6px); color: #38bdf8; }
