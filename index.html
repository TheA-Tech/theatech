<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEA.TECH | Enterprise IT Software House & Consultancy</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; scroll-behavior: smooth; }
        body { background-color: #f1f5f9; color: #0f172a; overflow-x: hidden; }
        
        /* CHROMIUM INTERACTIVE EFFECTS */
        @keyframes pulseGlow { 0% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.05); opacity: 0.6; } 100% { transform: scale(1); opacity: 0.4; } }
        @keyframes floatUp { 0% { transform: translateY(30px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        /* 1. NAVIGATION BAR */
        header { background-color: #ffffff; border-bottom: 1px solid #cbd5e1; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .logo-box { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 45px; width: auto; object-fit: contain; }
        .logo-text { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .logo-text .blue { color: #0284c7; }
        .logo-text .dark { color: #0f172a; }
        nav a { color: #64748b; text-decoration: none; margin-left: 25px; font-weight: 600; font-size: 15px; transition: 0.3s; }
        nav a:hover { color: #0284c7; }
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .whatsapp-btn-top { color: #16a34a; font-size: 26px; text-decoration: none; transition: 0.3s; }
        .whatsapp-btn-top:hover { transform: scale(1.15); }

        /* LAYOUT ARCHITECTURE */
        .section { padding: 100px 40px; max-width: 1200px; margin: 0 auto; text-align: center; border-bottom: 1px solid #e2e8f0; animation: floatUp 0.8s ease-out; }
        .glow-overlay { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(2, 132, 199, 0.08) 0%, transparent 70%); top: -10%; right: -5%; z-index: 1; animation: pulseGlow 6s infinite ease-in-out; pointer-events: none; }
        
        /* HERO COMPONENT */
        .hero-layout { display: flex; align-items: center; justify-content: space-between; gap: 50px; min-height: 65vh; text-align: left; }
        .hero-text { flex: 1.2; }
        .hero-graphic { flex: 0.8; display: flex; justify-content: center; }
        .badge { background-color: rgba(2, 132, 199, 0.06); color: #0284c7; border: 1px solid rgba(2, 132, 199, 0.2); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 20px; }
        h1 { font-size: 52px; font-weight: 900; color: #0f172a; line-height: 1.15; margin-bottom: 20px; }
        h1 span { color: #0284c7; }
        .hero-text p { font-size: 18px; color: #475569; margin-bottom: 35px; line-height: 1.6; }
        .btn-gradient { background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: #ffffff; padding: 14px 32px; border-radius: 8px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; box-shadow: 0 8px 20px rgba(2,132,199,0.2); }
        .btn-gradient:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(2,132,199,0.35); }
        .tech-box { width: 300px; height: 300px; background: #ffffff; border: 2px solid rgba(2,132,199,0.15); border-radius: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(0,0,0,0.03); }
        .tech-box i { font-size: 110px; color: #0284c7; }

        /* METRICS STRIP */
        .metrics-bar { background-color: #ffffff; border-y: 1px solid #e2e8f0; padding: 45px 20px; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
        .metrics-layout { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; }
        .metric-item h3 { font-size: 42px; font-weight: 800; color: #0f172a; }
        .metric-item h3 span { color: #0284c7; }
        .metric-item p { font-size: 13px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 5px; }

        /* 6+ CORE SERVICES GRID */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 50px; }
        .card { background-color: #ffffff; border: 1px solid #e2e8f0; padding: 40px 30px; border-radius: 16px; text-align: left; transition: 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.01); }
        .card:hover { transform: translateY(-5px); border-color: #0284c7; box-shadow: 0 20px 40px rgba(2,132,199,0.08); }
        .card i { font-size: 32px; color: #0284c7; margin-bottom: 20px; display: block; }
        .card h3 { font-size: 20px; color: #0f172a; margin-bottom: 12px; }
        .card p { font-size: 14px; color: #475569; line-height: 1.6; }

        /* BROAD ABOUT SPECS */
        .about-layout { display: flex; gap: 50px; align-items: center; text-align: left; background-color: #ffffff; padding: 50px; border-radius: 20px; border: 1px solid #e2e8f0; margin-top: 40px; }
        .about-text { flex: 1.3; }
        .about-visual { flex: 0.7; background: #f8fafc; border: 1px solid #cbd5e1; padding: 40px; border-radius: 16px; text-align: center; }
        .about-visual h4 { font-size: 56px; color: #0f172a; font-weight: 900; }
        .about-visual p { color: #0284c7; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-top: 5px; }

        /* CONTACT FORM WITH EMAIL MATRIX */
        .contact-box { display: flex; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.03); margin-top: 50px; text-align: left; }
        .contact-sidebar { flex: 0.85; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); padding: 50px; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; }
        .contact-form-side { flex: 1.15; padding: 50px; }
        .channels { margin: 30px 0; display: flex; flex-direction: column; gap: 25px; }
        .channel-row { display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit; font-size: 15px; font-weight: 600; }
        .channel-row i { width: 40px; height: 40px; background-color: rgba(255,255,255,0.08); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #38bdf8; }
        .socials a { color: #94a3b8; font-size: 22px; margin-right: 20px; text-decoration: none; transition: 0.3s; }
        .socials a:hover { color: #38bdf8; }
        
        .form-split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .form-field label { font-size: 12px; font-weight: 700; color: #0284c7; text-transform: uppercase; }
        .form-field input, .form-field select, .form-field textarea { background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; color: #0f172a; font-size: 14px; outline: none; width: 100%; }
        .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: #0284c7; background-color: #ffffff; }
        .submit-btn { width: 100%; background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(2,132,199,0.15); }

        footer { background-color: #ffffff; border-top: 1px solid #e2e8f0; padding: 40px; text-align: center; color: #64748b; font-size: 14px; }
        
        @media (max-width: 968px) { .grid { grid-template-columns: 1fr 1fr; } .hero-layout, .about-layout, .contact-box { flex-direction: column; text-align: center; } .hero-layout { text-align: center; } .form-split { grid-template-columns: 1fr; } }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .metrics-layout { grid-template-columns: 1fr 1fr; } header { flex-direction: column; gap: 15px; } nav a { margin: 0 10px; } }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-box">
            <img src="logo.png" alt="THEA.TECH Logo" class="logo-img" onerror="this.style.display='none';">
            <div class="logo-text"><span class="blue">THEA</span><span class="dark">.TECH</span></div>
        </a>
        <nav>
            <a href="#home-section">Home</a>
            <a href="#services-section">Services</a>
            <a href="#about-section">About</a>
            <a href="#contact-section">Contact</a>
        </nav>
        <div class="header-actions">
            <a href="https://wa.me" target="_blank" class="whatsapp-btn-top"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="section hero-layout" id="home-section">
        <div class="glow-overlay"></div>
        <div class="hero-text">
            <span class="badge">Architecting Corporate Digital Future</span>
            <h1>Design. Code.<br><span>Deploy Innovation.</span></h1>
            <p>Empowering progressive global operations with scalable enterprise software architecture, data engineering node optimization, and high-performance branding assets.</p>
            <a href="#services-section" class="btn-gradient">Explore 6+ Core Services</a>
        </div>
        <div class="hero-graphic">
            <div class="tech-box"><i class="fa-solid fa-laptop-code"></i></div>
        </div>
    </section>

    <!-- METRICS -->
    <section class="metrics-bar">
        <div class="metrics-layout">
            <div class="metric-item">
